<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <title>Image Enhancement</title>
    <link rel="stylesheet" href="styles.css">
</head>


<body>
    <h1>Currently testing</h1>
    <hr>

    <div id="utils">
        <button class="button" id="save">Save</button>
        <button class="button" id="undo">Undo</button>
        <button class="button" id="redo">Redo</button>
        <button class="button" id="showOg">Show original image</button>
    </div>

    <div id="image">
        <img id="output" alt="processing..." style="display: none; width: 400px;" src=""><br><br>
    </div>

    <input class="button" id="input" type="file" name="Escolha uma imagem" type="image"><br><br>

    <div id="options">
        <button id="inverse" type="button">Negative</button><br>
        <button id="thresholdToggle">Threshold</button>
        <input id="threshold" type="range" min="0" max="100" value="50" style="display: none"><br>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jimp@0.22.12/browser/lib/jimp.js"></script>
    <script src="script.js"></script>
</body>
</html>
